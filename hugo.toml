title = 'kr0no.me'
baseURL = 'https://kr0no.me'
theme = 'hugo-blog-awesome'
defaultContentLanguage = "es-es"
enableRobotsTXT = true
# `lastmod` (dateModified y sitemap) sale del historial de git, salvo que el post
# lo fije en su front matter. Los dos posts migrados desde Jekyll lo fijan: sus
# commits recientes son el cambio a multiidioma, no ediciones de contenido.
enableGitInfo = true

[frontmatter]
  lastmod = ['lastmod', ':git', 'date']

[services]
  [services.googleAnalytics]
    id = 'G-L9PMKJLY94'

# Only tags are used; the categories taxonomy generated empty, indexable pages.
[taxonomies]
  tag = 'tags'

[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark.renderer]
    unsafe = false
	[markup.tableOfContents]
		startLevel = 2
		endLevel = 4
		ordered = true

[Languages.es-es]
    label = 'Español'
    locale = 'es-ES'
    weight = 1

[Languages.en]
    label = 'English'
    locale = 'en-US'
    weight = 2

[Languages.es-es.menu]
[[Languages.es-es.menu.main]]
    pageRef="/"
    name = 'Home'
    url = '/'
    weight = 10

[[Languages.es-es.menu.main]]
    pageRef="posts"
    name = 'Posts'
    url = '/posts/'
    weight = 20

[[Languages.es-es.menu.main]]
    pageRef = "/pages/cve"
    name = 'CVEs'
    weight = 40

[Languages.es-es.params]
    sitename = "kr0no.me"
    # Fallback <meta name="description"> and og:description for pages without one.
    description = "Seguridad ofensiva, research y desarrollo de videojuegos."
    # Appended to the site title on the home page only.
    titleTagline = "Seguridad ofensiva, research y desarrollo de videojuegos."
    defaultColor = "dark"
    mainSections = ['posts']
    toc = false
    tocOpen = false
    goToTop = true
    dateFormat = ""
    rssFeedDescription = "summary"
    # schema.org Person.knowsAbout, to tie the author to his topics.
    knowsAbout = ["Seguridad informática", "Investigación de vulnerabilidades", "CVE", "Seguridad web", "Hardware hacking", "IoT"]

[Languages.es-es.params.author]
    avatar = "avatar.png"
    intro = "kr0no.me"
    name = "Aitor F. (kr0no)"
    fullName = "Aitor Fuentes"
    alternateName = "kr0no"
    jobTitle = "Security Researcher"
    description = "Aitor Fuentes, a.k.a kr0no. En mis ratos libres desarrollo videojuegos y cacharreo con cosas."

[[Languages.en.menu.main]]
    pageRef = "/"
    name = 'Home'
    weight = 10

[[Languages.en.menu.main]]
    pageRef = "posts"
    name = 'Posts'
    weight = 20

[[Languages.en.menu.main]]
    pageRef = "/pages/cve"
    name = 'CVEs'
    weight = 40

[Languages.en.params]
    sitename = "kr0no.me"
    description = "Offensive security, research and game development."
    titleTagline = "Offensive security, research and game development."
    defaultColor = "dark"
    mainSections = ['posts']
    toc = false
    tocOpen = false
    goToTop = true
    dateFormat = ""
    rssFeedDescription = "summary"
    knowsAbout = ["Information security", "Vulnerability research", "CVE", "Web security", "Hardware hacking", "IoT"]

[Languages.en.params.author]
    avatar = "avatar.png"
    intro = "kr0no.me"
    name = "Aitor F. (kr0no)"
    fullName = "Aitor Fuentes"
    alternateName = "kr0no"
    jobTitle = "Security researcher"
    description = "Aitor Fuentes, a.k.a kr0no. In my spare time I make video games and tinker with stuff."

