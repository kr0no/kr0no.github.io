# CVEs y advisories publicados. Fuente única para las dos versiones de la página
# /pages/cve/ (layouts/_shortcodes/vulns.html) y para el ItemList de schema.org
# (layouts/_partials/schema.html), así que no hay que tocar el contenido en cada idioma.
#
# Campos:
#   id       identificador (CVE-… o GHSA-…)
#   kind     "cve" o "advisory": separa las dos listas de la página
#   url      entrada oficial (NVD para CVEs, GitHub para advisories)
#   product  producto afectado
#   cvss     puntuación CVSS (opcional)
#   type     tipo de vulnerabilidad (opcional)
#   post     ruta del análisis en el blog (opcional, sin prefijo de idioma).
#            El enlace solo aparece cuando la página existe y está publicada.

